<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danh Thiếp NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: warm banner band at the top, the physical card (CR80 ratio) overlapping it, then actions, links, payment.
   Palette: MSB-style deep navy + red→orange gradient, warm off-white ground. */
:root{
  --bg:#FBF5F0; --band-a:#FFE7D6; --band-b:#FBF5F0; --surface:#FFFFFF; --ink:#13203F; --muted:#68708A; --line:#F0E2D8;
  --accent:#E5391F; --accent-2:#F58220; --accent-ink:#FFFFFF; --navy:#0F1E45; --navy-2:#1C2F66;
  --card-ink:#F5F7FC; --card-dim:#AFB8D4;
  --display:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1024; --band-a:#2A1A22; --band-b:#0A1024; --surface:#121A33; --ink:#EEF1F8; --muted:#9AA3BC; --line:#222C4B;
  --accent:#FF5A36; --accent-2:#FF9440; --accent-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1024; --band-a:#2A1A22; --band-b:#0A1024; --surface:#121A33; --ink:#EEF1F8; --muted:#9AA3BC; --line:#222C4B;
  --accent:#FF5A36; --accent-2:#FF9440; --accent-ink:#FFFFFF; color-scheme:dark}

*{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}
body{background:linear-gradient(180deg,var(--band-a) 0,var(--band-b) 340px) no-repeat,var(--bg);
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 40px;overflow-x:hidden}
.dunes{position:absolute;left:0;right:0;top:0;height:300px;width:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* The card */
.stage{perspective:1100px}
.card{position:relative;aspect-ratio:85.6/54;max-width:100%;border-radius:16px;overflow:hidden;color:var(--card-ink);
  background:linear-gradient(140deg,var(--navy) 0%,var(--navy) 50%,var(--navy-2) 100%);
  box-shadow:0 24px 48px -20px rgba(15,30,69,.6),0 2px 0 rgba(255,255,255,.06) inset;padding:18px 20px;
  display:flex;flex-direction:column;justify-content:space-between;transform-origin:50% 100%}
.card .waves{position:absolute;right:0;bottom:0;width:78%;height:auto;pointer-events:none}
.card .shine{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%)}
.card > *:not(.waves):not(.shine){position:relative}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.04em;min-width:0}
.brand i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--accent-2),var(--accent));flex:none}
.brand span{font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-dim)}
.nfc{width:26px;height:26px;flex:none}
.nfc path{opacity:.9}
.card-mid{display:flex;align-items:center;gap:14px}
.avatar{width:66px;height:66px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.4);
  background:linear-gradient(135deg,var(--accent-2),var(--accent)) center/cover no-repeat;background-color:#fff;display:grid;place-items:center;
  font:700 22px var(--display);color:#fff}
.who{min-width:0}
.who h1{font:700 clamp(19px,5.6vw,24px)/1.15 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.who p{margin:3px 0 0;font-size:13px;color:#FFC9A8;font-weight:500}
.card-bot{font-family:var(--mono);font-size:11.5px;color:var(--card-dim);letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}

.bio{margin:0;color:var(--muted);font-size:14.5px}

/* Primary actions */
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border:0;border-radius:14px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--accent-ink);font:600 15.5px var(--body);cursor:pointer;
  box-shadow:0 10px 24px -12px rgba(229,57,31,.7)}
.save svg{width:20px;height:20px}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:500 12.5px var(--body);cursor:pointer;
  transition:transform .15s,border-color .15s}
.act svg{width:22px;height:22px;color:var(--accent)}
.act:hover,.link:hover{border-color:var(--accent-2)}
.act:active,.link:active,.save:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Link list */
h2{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:14px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink);text-decoration:none;min-width:0;transition:transform .15s,border-color .15s}
.badge{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 13px var(--body)}
.badge svg{width:20px;height:20px}
.ltext{min-width:0;flex:1}
.ltext b{display:block;font-weight:600;font-size:14.5px}
.ltext span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:16px;height:16px;color:var(--muted);flex:none}

/* Bank */
.bank{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;position:relative;overflow:hidden}
.bank::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.payqr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 12px;margin-bottom:2px;border-bottom:1px dashed var(--line)}
#bankqr{width:210px;max-width:100%;background:#fff;padding:10px;border-radius:12px;border:1px solid #F0E2D8}
#bankqr img,#bankqr canvas{width:100%!important;height:auto!important;display:block}
.payqr small{color:var(--muted);font-size:12.5px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row small{color:var(--muted);font-size:12.5px}
.row strong{font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;word-break:break-all;text-align:right}
.copy{border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:8px;padding:5px 10px;font:600 12px var(--body);cursor:pointer;flex:none}

/* Share */
.share{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
#qr{width:104px;height:104px;flex:none;background:#fff;padding:6px;border-radius:8px}
#qr img,#qr canvas{width:100%!important;height:auto!important}
.share p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1}

/* ---------- Opening motion ---------- */
@media (prefers-reduced-motion: no-preference){
  .dunes path{animation:dune 1.4s cubic-bezier(.2,.8,.2,1) both}
  .dunes path:nth-child(2){animation-delay:.08s} .dunes path:nth-child(3){animation-delay:.16s}
  .card{animation:cardIn .9s cubic-bezier(.18,.9,.25,1.05) .1s both}
  .card .waves path{animation:waveIn 1.1s cubic-bezier(.2,.8,.2,1) both}
  .card .waves path:nth-child(1){animation-delay:.45s} .card .waves path:nth-child(2){animation-delay:.55s} .card .waves path:nth-child(3){animation-delay:.65s}
  .card .shine{animation:shine 1.1s ease-in-out 1s both}
  .card-mid,.card-bot,.card-top{animation:fadeUp .6s ease-out both}
  .card-top{animation-delay:.5s} .card-mid{animation-delay:.62s} .card-bot{animation-delay:.74s}
  .nfc path{animation:nfc 1.4s ease-in-out .9s 2 both}
  .nfc path:nth-child(2){animation-delay:1.05s} .nfc path:nth-child(3){animation-delay:1.2s}
  .rise{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.75s + var(--i,0) * .07s)}
  .save{background-size:200% 100%;background-image:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent))}
  .save.rise{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both,glow 3s ease-in-out 2s infinite;animation-delay:calc(.75s + var(--i,0) * .07s),2s}
}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px) rotateX(28deg) scale(.92)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes waveIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes dune{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes nfc{0%,100%{opacity:.9}40%{opacity:.15}}
@keyframes glow{0%,100%{background-position:0 0}50%{background-position:100% 0}}
</style>
</head>

  user:'<circle cx="10" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  globe:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  chev:'<path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
const svg = (k, cls="") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${ICON[k]}</svg>`;

const NETS = {
  facebook:{label:"Facebook", color:"#1877F2", mark:"f"},
  messenger:{label:"Messenger", color:"#0A7CFF", mark:"m"},
  zalo:{label:"Zalo", color:"#0068FF", mark:"Zalo"},
  tiktok:{label:"TikTok", color:"#111111", mark:"♪"},
  linkedin:{label:"LinkedIn", color:"#0A66C2", mark:"in"},
  youtube:{label:"YouTube", color:"#E62117", mark:"▶"},
  instagram:{label:"Instagram", color:"#C13584", mark:"IG"},
  telegram:{label:"Telegram", color:"#229ED9", mark:"✈"}
};

function pick(){
  const q = new URLSearchParams(location.search).get("u");
  const h = location.hash.replace("#","");
  return PROFILES[q] || PROFILES[h] || Object.values(PROFILES)[0];
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => n.trim().split(/\s+/).slice(-2).map(w => w[0]).join("").toUpperCase();
const pretty = u => { let t=u; try{ t=decodeURIComponent(u); }catch(e){} return t.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""); };

function render(p){
  const s = p.socials || {};
  const links = [];
  if (p.zalo) links.push({net:"zalo", href:"https://zalo.me/"+p.zalo.replace(/\D/g,""), sub:p.zalo});
  for (const [k,url] of Object.entries(s)) if (url && NETS[k]) links.push({net:k, href:url, sub:pretty(url)});

  const linkHTML = links.map(l => {
    const n = NETS[l.net];
    return `<a class="link" href="${esc(l.href)}" target="_blank" rel="noopener">
      <span class="badge" style="background:${n.color};font-size:${n.mark.length>2?'10.5px':'14px'}">${n.mark}</span>
      <span class="ltext"><b>${n.label}</b><span>${esc(l.sub)}</span></span>${svg("chev","chev")}</a>`;
  }).join("");

  const extra = [
    p.website && `<a class="link" href="${esc(p.website)}" target="_blank" rel="noopener"><span class="badge" style="background:var(--accent);color:var(--accent-ink)">${svg("globe")}</span><span class="ltext"><b>Website</b><span>${esc(pretty(p.website))}</span></span>${svg("chev","chev")}</a>`,
    p.address && `<a class="link" href="https://www.google.com/maps/search/${encodeURIComponent(p.address)}" target="_blank" rel="noopener"><span class="badge" style="background:var(--accent);color:var(--accent-ink)">${svg("pin")}</span><span class="ltext"><b>Địa chỉ</b><span>${esc(p.address)}</span></span>${svg("chev","chev")}</a>`
  ].filter(Boolean).join("");

  const tel = p.phone ? p.phone.replace(/\s/g,"") : "";
  document.title = p.name + " · Danh thiếp";

  document.getElementById("app").innerHTML = `
  <div class="stage"><section class="card" aria-label="Danh thiếp">
    <svg class="waves" viewBox="0 0 320 200" aria-hidden="true">
      <defs><linearGradient id="cw" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F58220"/><stop offset="1" stop-color="#E5391F"/></linearGradient></defs>
      <path d="M320 40C250 70 230 140 140 150S30 190 0 200H320Z" fill="url(#cw)" opacity=".22"/>
      <path d="M320 90C270 110 250 160 170 170S80 195 60 200H320Z" fill="url(#cw)" opacity=".5"/>
      <path d="M320 140C290 150 270 185 220 200H320Z" fill="url(#cw)"/>
    </svg>
    <span class="shine"></span>
    <div class="card-top">
      <span class="brand">${p.company?`<i></i>${esc(p.company)}`:""}${p.unit?` <span>${esc(p.unit)}</span>`:""}</span>
      <svg class="nfc" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M6 8a6 6 0 0 1 0 8"/><path d="M10 5.5a10 10 0 0 1 0 13"/><path d="M14 3a14 14 0 0 1 0 18"/></svg>
    </div>
    <div class="card-mid">
      <div class="avatar" ${p.avatar?`style="background-image:url('${esc(p.avatar)}')"`:""}>${p.avatar?"":esc(initials(p.name))}</div>
      <div class="who"><h1>${esc(p.name)}</h1><p>${esc(p.title)}</p></div>
    </div>
    <div class="card-bot"><span>${tel?esc(tel.replace(/(\d{4})(\d{3})(\d+)/,"$1 $2 $3")):""}</span><span>${esc(p.cardId||"")}</span></div>
  </section></div>

  ${p.bio?`<p class="bio rise" style="--i:0">${esc(p.bio)}</p>`:""}

  <button class="save rise" style="--i:1" id="save" type="button">${svg("user")} Lưu vào danh bạ</button>

  <nav class="actions rise" style="--i:2" aria-label="Liên hệ nhanh">
    ${tel?`<a class="act" href="tel:${esc(tel)}">${svg("phone")}Gọi</a>`:""}
    ${p.zalo?`<a class="act" href="https://zalo.me/${esc(p.zalo.replace(/\D/g,""))}" target="_blank" rel="noopener">${svg("chat")}Zalo</a>`:""}
    ${p.email?`<a class="act" href="mailto:${esc(p.email)}">${svg("mail")}Email</a>`:""}
    <button class="act" id="shareBtn" type="button">${svg("share")}Chia sẻ</button>
  </nav>

  ${(linkHTML||extra)?`<h2 class="rise" style="--i:3">Kết nối</h2><div class="links rise" style="--i:4">${linkHTML}${extra}</div>`:""}

  ${p.bank?`<h2 class="rise" style="--i:5">Chuyển khoản</h2>
  <div class="bank rise" style="--i:6">
    ${p.bank.vietqr?`<div class="payqr"><div id="bankqr" aria-label="Mã QR chuyển khoản"></div><small>Mở app ngân hàng, chọn Quét QR để chuyển khoản</small></div>`:""}
    <div class="row"><small>Ngân hàng</small><strong>${esc(p.bank.name)}</strong></div>
    <div class="row"><small>Chủ tài khoản</small><strong>${esc(p.bank.holder)}</strong></div>
    <div class="row"><small>Số tài khoản</small><span style="display:flex;gap:8px;align-items:center;min-width:0"><strong>${esc(p.bank.number)}</strong><button class="copy" type="button" data-copy="${esc(p.bank.number)}">Sao chép</button></span></div>
  </div>`:""}

  <h2 class="rise" style="--i:7" id="shareHead">Chia sẻ hồ sơ</h2>
  <div class="share rise" style="--i:8">
    <div id="qr" aria-label="Mã QR của hồ sơ"></div>
    <div style="min-width:0">
      <p>Quét mã hoặc gửi đường dẫn này cho người khác.</p>
      <button class="copy" type="button" data-copy="${esc(location.href)}">Sao chép đường dẫn</button>
    </div>
  </div>

  <p class="foot">Chạm thẻ NFC hoặc quét QR để mở trang này</p>`;

  try { new QRCode(document.getElementById("qr"), {text:location.href, width:184, height:184, colorDark:"#0F1E45", correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ document.getElementById("qr").textContent = ""; }

  if (p.bank && p.bank.vietqr) {
    try { new QRCode(document.getElementById("bankqr"), {text:p.bank.vietqr, width:360, height:360, colorDark:"#0F1E45", correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){}
  }

  document.getElementById("save").onclick = () => saveVcf(p);
  document.getElementById("shareBtn").onclick = async () => {
    if (navigator.share) { try { await navigator.share({title:p.name, url:location.href}); return; } catch(e){} }
    document.getElementById("shareHead").scrollIntoView({behavior:"smooth", block:"start"});
  };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
}

function saveVcf(p){
  const parts = p.name.trim().split(/\s+/);
  const lines = [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${parts.slice(0,-1).join(" ")};${parts.slice(-1)[0]};;;`,
    `FN:${p.name}`,
    p.company && `ORG:${p.company}`, p.title && `TITLE:${p.title}`,
    p.phone && `TEL;TYPE=CELL:${p.phone}`, p.email && `EMAIL:${p.email}`,
    p.website && `URL:${p.website}`, p.address && `ADR;TYPE=WORK:;;${p.address};;;;`,
    `NOTE:${location.href}`, "END:VCARD"
  ].filter(Boolean).join("\r\n");
  const blob = new Blob([lines], {type:"text/vcard;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = p.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/\s+/g,"_") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Đang mở tệp danh bạ…");
}

function copy(text){
  const done = () => toast("Đã sao chép");
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fallback(text));
  else fallback(text);
  function fallback(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast(t); } ta.remove(); }
}
let tt; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1800); }

render(pick());
window.addEventListener("hashchange", () => render(pick()));
</script>
</body>
</html>
