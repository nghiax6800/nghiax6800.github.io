<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danh Thiếp NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column; the top is the physical card itself (CR80, 85.6×54mm), then actions, then link list. */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#13202B; --muted:#5B6B74; --line:#D8E0E3;
  --accent:#0E7C66; --accent-ink:#FFFFFF;
  --card-a:#14262F; --card-b:#0B5A4B; --card-ink:#F2F6F5; --card-dim:#9FC4BA;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1316; --surface:#141E23; --ink:#E7EEF0; --muted:#93A4AB; --line:#24333A;
  --accent:#3CC4A3; --accent-ink:#06231C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1316; --surface:#141E23; --ink:#E7EEF0; --muted:#93A4AB; --line:#24333A;
  --accent:#3CC4A3; --accent-ink:#06231C; color-scheme:dark}

*{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* The card */
.card{position:relative;aspect-ratio:85.6/54;max-width:100%;border-radius:14px;overflow:hidden;color:var(--card-ink);
  background:linear-gradient(135deg,var(--card-a) 0%,var(--card-a) 45%,var(--card-b) 100%);
  box-shadow:0 18px 40px -18px rgba(10,30,30,.55);padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.12),transparent 55%)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-dim);font-weight:600;min-width:0}
.nfc{width:26px;height:26px;flex:none;opacity:.85}
.card-mid{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.35);
  background:#24414A center/cover no-repeat;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--card-ink)}
.who{min-width:0}
.who h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,6vw,25px);line-height:1.15;margin:0;text-wrap:balance}
.who p{margin:2px 0 0;font-size:13px;color:var(--card-dim)}
.card-bot{font-family:var(--mono);font-size:11px;color:var(--card-dim);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}

.bio{margin:0;color:var(--muted);font-size:14.5px;text-align:left}

/* Primary actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:500 12.5px var(--body);cursor:pointer}
.act svg{width:22px;height:22px;color:var(--accent)}
.act:hover{border-color:var(--accent)}
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border:0;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font:600 15.5px var(--body);cursor:pointer}
.save svg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Link list */
h2{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 -8px}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink);text-decoration:none;min-width:0}
.link:hover{border-color:var(--accent)}
.badge{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 13px var(--body)}
.badge svg{width:20px;height:20px}
.ltext{min-width:0;flex:1}
.ltext b{display:block;font-weight:600;font-size:14.5px}
.ltext span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:16px;height:16px;color:var(--muted);flex:none}

/* Bank */
.bank{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row small{color:var(--muted);font-size:12.5px}
.row strong{font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;word-break:break-all;text-align:right}
.copy{border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:8px;padding:5px 10px;font:600 12px var(--body);cursor:pointer;flex:none}

/* Share */
.share{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
#qr{width:104px;height:104px;flex:none;background:#fff;padding:6px;border-radius:8px}
#qr img,#qr canvas{width:100%!important;height:auto!important}
.share p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:360px){.actions{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   CẤU HÌNH HỒ SƠ — mỗi khách hàng là một mục trong PROFILES.
   Mở hồ sơ bằng:  https://ten-mien-cua-ban.vn/?u=nguyen-van-an
   (hoặc .../#nguyen-van-an). Không có mã → hiện hồ sơ đầu tiên.
   Bỏ trống trường nào thì mục đó tự ẩn.
   ===================================================================== */
const PROFILES = {
  "nguyen-van-an": {
    name: "Nguyễn Văn An",
    title: "Giám đốc Kinh doanh",
    company: "Công ty TNHH Minh Phát",
    avatar: "",                      // link ảnh đại diện, để trống = hiện chữ cái đầu
    bio: "Tư vấn giải pháp kho vận cho doanh nghiệp sản xuất tại miền Bắc. Hơn 10 năm kinh nghiệm.",
    phone: "0912345678",
    zalo: "0912345678",
    email: "an.nguyen@minhphat.vn",
    website: "https://minhphat.vn",
    address: "Tầng 8, 72 Trần Duy Hưng, Cầu Giấy, Hà Nội",
    socials: {
      facebook:  "https://facebook.com/nguyenvanan",
      messenger: "https://m.me/nguyenvanan",
      tiktok:    "https://www.tiktok.com/@nguyenvanan",
      linkedin:  "https://www.linkedin.com/in/nguyenvanan",
      youtube:   "https://youtube.com/@minhphat",
      instagram: "",
      telegram:  "",
    },
    bank: { name: "Vietcombank", number: "0011004567890", holder: "NGUYEN VAN AN" },
    cardId: "MP-0001"
  },
  "tran-thi-binh": {
    name: "Trần Thị Bình",
    title: "Chuyên viên tư vấn BĐS",
    company: "Sàn Giao dịch An Cư",
    avatar: "",
    bio: "Căn hộ và nhà phố khu vực Tây Hồ, Long Biên. Hỗ trợ xem nhà cả cuối tuần.",
    phone: "0987654321",
    zalo: "0987654321",
    email: "binh.tran@ancu.vn",
    website: "",
    address: "",
    socials: { facebook: "https://facebook.com/tranthibinh", tiktok: "https://www.tiktok.com/@binhbds", instagram: "https://instagram.com/binhbds" },
    bank: null,
    cardId: "AC-0127"
  }
};

/* ---------- Không cần sửa phần dưới ---------- */
const ICON = {
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m3 7 9 6 9-6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  share:'<circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6" stroke="currentColor" stroke-width="1.8"/>',
  user:'<circle cx="10" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  globe:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  chev:'<path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
const svg = (k, cls="") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${ICON[k]}</svg>`;

const NETS = {
  facebook:{label:"Facebook", color:"#1877F2", mark:"f"},
  messenger:{label:"Messenger", color:"#0A7CFF", mark:"m"},
  zalo:{label:"Zalo", color:"#0068FF", mark:"Zalo"},
  tiktok:{label:"TikTok", color:"#111111", mark:"♪"},
  linkedin:{label:"LinkedIn", color:"#0A66C2", mark:"in"},
  youtube:{label:"YouTube", color:"#E62117", mark:"▶"},
  instagram:{label:"Instagram", color:"#C13584", mark:"IG"},
  telegram:{label:"Telegram", color:"#229ED9", mark:"✈"}
};

function pick(){
  const q = new URLSearchParams(location.search).get("u");
  const h = location.hash.replace("#","");
  return PROFILES[q] || PROFILES[h] || Object.values(PROFILES)[0];
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => n.trim().split(/\s+/).slice(-2).map(w => w[0]).join("").toUpperCase();
const pretty = u => u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");

function render(p){
  const s = p.socials || {};
  const links = [];
  if (p.zalo) links.push({net:"zalo", href:"https://zalo.me/"+p.zalo.replace(/\D/g,""), sub:p.zalo});
  for (const [k,url] of Object.entries(s)) if (url && NETS[k]) links.push({net:k, href:url, sub:pretty(url)});

  const linkHTML = links.map(l => {
    const n = NETS[l.net];
    return `<a class="link" href="${esc(l.href)}" target="_blank" rel="noopener">
      <span class="badge" style="background:${n.color};font-size:${n.mark.length>2?'10.5px':'14px'}">${n.mark}</span>
      <span class="ltext"><b>${n.label}</b><span>${esc(l.sub)}</span></span>${svg("chev","chev")}</a>`;
  }).join("");

  const extra = [
    p.website && `<a class="link" href="${esc(p.website)}" target="_blank" rel="noopener"><span class="badge" style="background:var(--accent);color:var(--accent-ink)">${svg("globe")}</span><span class="ltext"><b>Website</b><span>${esc(pretty(p.website))}</span></span>${svg("chev","chev")}</a>`,
    p.address && `<a class="link" href="https://www.google.com/maps/search/${encodeURIComponent(p.address)}" target="_blank" rel="noopener"><span class="badge" style="background:var(--accent);color:var(--accent-ink)">${svg("pin")}</span><span class="ltext"><b>Địa chỉ</b><span>${esc(p.address)}</span></span>${svg("chev","chev")}</a>`
  ].filter(Boolean).join("");

  const tel = p.phone ? p.phone.replace(/\s/g,"") : "";
  document.title = p.name + " · Danh thiếp";

  document.getElementById("app").innerHTML = `
  <section class="card" aria-label="Danh thiếp">
    <div class="card-top">
      <span class="brand">${esc(p.company)}</span>
      <svg class="nfc" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M6 8a6 6 0 0 1 0 8"/><path d="M10 5.5a10 10 0 0 1 0 13"/><path d="M14 3a14 14 0 0 1 0 18"/></svg>
    </div>
    <div class="card-mid">
      <div class="avatar" ${p.avatar?`style="background-image:url('${esc(p.avatar)}')"`:""}>${p.avatar?"":esc(initials(p.name))}</div>
      <div class="who"><h1>${esc(p.name)}</h1><p>${esc(p.title)}</p></div>
    </div>
    <div class="card-bot"><span>${tel?esc(tel.replace(/(\d{4})(\d{3})(\d+)/,"$1 $2 $3")):""}</span><span>${esc(p.cardId||"")}</span></div>
  </section>

  ${p.bio?`<p class="bio">${esc(p.bio)}</p>`:""}

  <button class="save" id="save" type="button">${svg("user")} Lưu vào danh bạ</button>

  <nav class="actions" aria-label="Liên hệ nhanh">
    ${tel?`<a class="act" href="tel:${esc(tel)}">${svg("phone")}Gọi</a>`:""}
    ${p.zalo?`<a class="act" href="https://zalo.me/${esc(p.zalo.replace(/\D/g,""))}" target="_blank" rel="noopener">${svg("chat")}Zalo</a>`:""}
    ${p.email?`<a class="act" href="mailto:${esc(p.email)}">${svg("mail")}Email</a>`:""}
    <button class="act" id="shareBtn" type="button">${svg("share")}Chia sẻ</button>
  </nav>

  ${(linkHTML||extra)?`<h2>Kết nối</h2><div class="links">${linkHTML}${extra}</div>`:""}

  ${p.bank?`<h2>Chuyển khoản</h2>
  <div class="bank">
    <div class="row"><small>Ngân hàng</small><strong>${esc(p.bank.name)}</strong></div>
    <div class="row"><small>Chủ tài khoản</small><strong>${esc(p.bank.holder)}</strong></div>
    <div class="row"><small>Số tài khoản</small><span style="display:flex;gap:8px;align-items:center;min-width:0"><strong>${esc(p.bank.number)}</strong><button class="copy" type="button" data-copy="${esc(p.bank.number)}">Sao chép</button></span></div>
  </div>`:""}

  <h2 id="shareHead">Chia sẻ hồ sơ</h2>
  <div class="share">
    <div id="qr" aria-label="Mã QR của hồ sơ"></div>
    <div style="min-width:0">
      <p>Quét mã hoặc gửi đường dẫn này cho người khác.</p>
      <button class="copy" type="button" data-copy="${esc(location.href)}">Sao chép đường dẫn</button>
    </div>
  </div>

  <p class="foot">Chạm thẻ NFC hoặc quét QR để mở trang này</p>`;

  try { new QRCode(document.getElementById("qr"), {text:location.href, width:184, height:184, correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ document.getElementById("qr").textContent = ""; }

  document.getElementById("save").onclick = () => saveVcf(p);
  document.getElementById("shareBtn").onclick = async () => {
    if (navigator.share) { try { await navigator.share({title:p.name, url:location.href}); return; } catch(e){} }
    document.getElementById("shareHead").scrollIntoView({behavior:"smooth", block:"start"});
  };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
}

function saveVcf(p){
  const parts = p.name.trim().split(/\s+/);
  const lines = [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${parts.slice(0,-1).join(" ")};${parts.slice(-1)[0]};;;`,
    `FN:${p.name}`,
    p.company && `ORG:${p.company}`, p.title && `TITLE:${p.title}`,
    p.phone && `TEL;TYPE=CELL:${p.phone}`, p.email && `EMAIL:${p.email}`,
    p.website && `URL:${p.website}`, p.address && `ADR;TYPE=WORK:;;${p.address};;;;`,
    `NOTE:${location.href}`, "END:VCARD"
  ].filter(Boolean).join("\r\n");
  const blob = new Blob([lines], {type:"text/vcard;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = p.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/\s+/g,"_") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Đang mở tệp danh bạ…");
}

function copy(text){
  const done = () => toast("Đã sao chép");
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => fallback(text));
  else fallback(text);
  function fallback(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast(t); } ta.remove(); }
}
let tt; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1800); }

render(pick());
window.addEventListener("hashchange", () => render(pick()));
</script>
</body>
</html>
